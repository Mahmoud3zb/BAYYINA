    <path d="M8.5 28C8.5 24 11.8 20.8 15.8 20.8H16.2C20.2 20.8 23.5 24 23.5 28C23.5 28.5 23.1 29 22.5 29H9.5C8.9 29 8.5 28.5 8.5 28Z" fill="white"/>
