<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hr_purple_grad" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="hr_glow" x1="10" y1="8" x2="30" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5B4FC" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hr_accent" x1="14" y1="12" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C084FC"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="hr_shadow" x="2" y="4" width="36" height="34" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#312E81" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Ambient Circle -->
  <circle cx="20" cy="20" r="18" fill="url(#hr_purple_grad)"/>
  <circle cx="20" cy="20" r="18" fill="url(#hr_glow)"/>
