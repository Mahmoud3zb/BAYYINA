  <g filter="url(#hr_shadow)">
    <!-- Secondary Right Person (Soft Accent) -->
    <circle cx="25.5" cy="14.5" r="3.75" fill="#E0E7FF" fill-opacity="0.85"/>
    <path d="M21.5 27.5C21.5 24.2 24.1 21.6 27.3 21.6H27.7C29.8 21.6 31.7 22.8 32.6 24.7C33.2 25.8 32.5 27.5 31.2 27.5H21.5Z" fill="#C7D2FE" fill-opacity="0.75"/>
